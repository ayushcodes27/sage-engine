name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gateway-tests:
    name: Java Gateway Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests
        run: mvn -B test -f sage-gateway/pom.xml

  ml-pipeline:
    name: Python ML & Integrity Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with full tags & history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt -r ml_pipeline/requirements-harness.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff (Critical Syntax & Error Checks)
        run: |
          ruff check --select E9,F63,F7,F82 ml_pipeline
          ruff check ml_pipeline --exit-zero

      - name: Verify Frozen Model & Contract Integrity
        # Models, contracts and datasets must stay byte-identical to tag v2-frozen-models-v6. The scoring-path
        # source files (inference service, gateway filter, Redis telemetry service, application.yaml) were
        # deliberately revised after that tag (multi-shadow scoring, failure cooldown, atomic decision cache);
        # they are listed below for information, and campaign runs pin them by container hash at run time.
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys
          TAG = "v2-frozen-models-v6"
          show = lambda p: subprocess.run(["git", "show", f"{TAG}:{p}"], capture_output=True, check=True).stdout
          manifest = json.loads(show("ml_pipeline/models/frozen_models_manifest.json"))
          bad, revised = [], []
          for path, expected in manifest["frozen_files"].items():
              disk = open(path, "rb").read()
              if path.startswith(("sage-gateway/", "ml_pipeline/inference_service/")):
                  if disk != show(path):
                      revised.append(path)
                  continue
              if hashlib.sha256(disk).hexdigest() != expected or disk != show(path):
                  bad.append(path)
          print(f"checked {len(manifest['frozen_files'])} frozen files against {TAG}")
          print("scoring-path files revised since the tag (informational):", *revised, sep="\n  ")
          if bad:
              sys.exit("FROZEN ARTEFACT CHANGED: " + ", ".join(bad))
          print("models, contracts and datasets are byte-identical to the tag")
          PY

      - name: Run Python ML Unit & Parity Tests
        env:
          PYTHONPATH: .
        run: |
          pytest ml_pipeline -v
